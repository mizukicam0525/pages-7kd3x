<head>
<meta charset="utf-8">

<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1sSi2i2uD1be5hyRYXrpMYy67nIIZ3TQo">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #23241f; --sub: #6d6a5e;
    --line: #e3ded2; --accent: #b3541e; --accent-soft: #f7e8dd;
    --ok: #2e7d46; --warn: #a15c00; --chip: #efece3; --tint: #cdc3ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1f24; --card: #26282f; --ink: #ece9e0; --sub: #a3a091;
      --line: #3a3d47; --accent: #e08a4e; --accent-soft: #3a2d22;
      --ok: #6fce8b; --warn: #e0a44e; --chip: #32343d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 16px 14px 40px; }
  header h1 { font-size: 20px; margin: 4px 0 2px; }
  .headrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .headrow .chip { margin-left: auto; }
  header .updated { color: var(--sub); font-size: 12px; }
  .hero { background: var(--accent-soft); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
  .hero .label { font-size: 12px; color: var(--sub); }
  .hero .count { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero .next { font-size: 13px; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .poolmark { font-size: 10px; opacity: .8; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0 14px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .chip.active { background: var(--ink); color: var(--bg); }
  .filters select { font-size: 12px; padding: 4px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .filters label { font-size: 12px; color: var(--sub); }
  .slot { font-size: 13px; font-weight: 700; color: var(--sub); margin: 16px 0 6px; }
  .card { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .left { width: 100px; flex: 0 0 100px; }
  .time { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .datelab { font-size: 11px; color: var(--sub); }
  .poster { display: block; width: 100%; height: auto; margin-top: 8px;
    border: 1px solid var(--line); border-radius: 6px; }
  .body { flex: 1; min-width: 0; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 999px;
    background: var(--chip); color: var(--sub); }
  .badge.main { background: var(--accent); color: #fff; }
  .badge.pool { background: var(--warn); color: #fff; }
  .badge.site { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .name { font-size: 15px; font-weight: 700; line-height: 1.4; }
  .name a { color: inherit; text-decoration: none; }
  .meta { font-size: 12px; color: var(--sub); margin-top: 2px; line-height: 1.5; }
  .ticket { font-size: 12px; margin-top: 4px; line-height: 1.5; }
  .note { font-size: 12px; color: var(--warn); margin-top: 4px; line-height: 1.5; }
  .testrow { margin-top: 8px; font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .testrow button { font-size: 12px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .tested { color: var(--ok); font-weight: 700; }
  .empty { color: var(--sub); font-size: 13px; padding: 18px 0; }
  .addwatch { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 10px 0 4px; }
  .addwatch input { font-size: 12px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .addwatch button { font-size: 12px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  details.watch { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.watch summary { font-size: 13px; font-weight: 700; cursor: pointer; }
  .watch ul { list-style: none; padding: 0; margin: 8px 0 0; columns: 2; }
  .watch li { font-size: 12px; margin: 3px 0; break-inside: avoid; }
  .watch a { color: var(--accent); text-decoration: none; }
  @media (max-width: 560px) { .watch ul { columns: 1; } .left { width: 84px; flex-basis: 84px; } }
  .poster { cursor: zoom-in; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9);
    display: none; align-items: center; justify-content: center; z-index: 9999; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 96vw; max-height: 94vh; }
  #lightboxClose { position: absolute; top: 10px; right: 16px; color: #fff;
    font-size: 32px; line-height: 1; cursor: pointer; }
  #calPanel { margin: 8px 0; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; max-width: 320px; background: var(--card); }
  .cal-head { display: flex; justify-content: space-between; align-items: center;
    font-weight: 700; margin-bottom: 6px; }
  .cal-head button { border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--sub); padding: 2px 0; }
  .cal-day { text-align: center; padding: 6px 0; font-size: 13px; border-radius: 6px;
    border: none; background: none; color: var(--ink); cursor: pointer; }
  .cal-day.has { background: var(--accent-soft); font-weight: 700; color: var(--accent); }
  .cal-day.sel { outline: 2px solid var(--accent); }
  .cal-day:disabled { color: var(--sub); opacity: .45; cursor: default; }
  .cal-day.empty { visibility: hidden; }
  .detailBtn { align-self: center; flex: none; border: none; background: none;
    color: var(--sub); font-size: 26px; line-height: 1; padding: 10px 2px; cursor: pointer; }
  .cFront, .cBack, .rFront, .rBack { transition: opacity .16s ease, transform .16s ease; }
  .rBack { font-size: 12px; line-height: 1.5; }
  .cBack { font-size: 12px; line-height: 1.5; }
  .dHead { margin-bottom: 2px; font-size: 12px; }
  .dSec { margin: 6px 0 2px; font-size: 12px; }
  .cBack .inwatch { color: var(--accent); }
  .dots { text-align: center; margin-top: 5px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--line); margin: 0 4px; cursor: pointer; }
  .dot.active { background: var(--accent); }
  .reqHead { font-weight: 700; margin: 10px 0 4px; font-size: 13px; }

  /* ---- ライブ側テーマ（v46） ---- */
  body.live-violet { --bg: #cdc3ee; --accent: #5a4ea8; --accent-soft: #e4def8; --chip: #ded7f4; }
  body.live-navy { --bg: #1e2542; --accent: #4576d6; --accent-soft: #2e3c6b; --chip: #2a3358; }
  body.live-navy header h1, body.live-navy details.watch summary,
  body.live-navy .reqHead, body.live-navy .watch li { color: #f2f4ff; }
  body.live-navy .updated, body.live-navy #howItWorks, body.live-navy .slot,
  body.live-navy .empty, body.live-navy .filters label { color: #a8b2d4; }
  body.live-navy .hero { background: #2d3a68; border-color: #3a4a80; }
  body.live-navy .hero .label { color: #a8b2d4; }
  body.live-navy .hero .count, body.live-navy .hero .next { color: #f2f4ff; }
  body.live-navy .chip { background: #2a3358; color: #e6ebff; border-color: #3a4a80; }
  body.live-navy .chip.active { background: #e6ebff; color: #1e2542; }
  body.live-navy .tab { border-color: #3a4a80; }
  body.live-navy .tab.active { background: #4576d6; border-color: #4576d6; color: #fff; }
  body.live-navy .badge.site { color: #c2d4ff; }
  body.live-navy .cal-day.has { background: #dbe4ff; color: #2f5aa8; }
  body.live-navy .watch a { color: #c2d4ff; }
  body.live-navy details.watch { border-top-color: #3a4a80; }
  /* ---- モード切替アニメーション（v46） ---- */
  #fx { position: fixed; inset: 0; overflow: hidden; pointer-events: none; display: none; z-index: 10000; }
  #fx.on { display: block; }
  .colPanel { position: absolute; top: 0; bottom: 0; width: 100%; will-change: transform; }
  #colL { background: #f6f4ef; }
  #colR { background: var(--tint); }
  #fxRotator { position: absolute; left: 50%; top: 44%; width: 0; height: 0; will-change: transform; }
  #fxDisc { position: absolute; width: 260vmax; height: 260vmax; left: -130vmax; top: -130vmax; display: none; }
  #fxDisc .dL { position: absolute; inset: 0; background: #f6f4ef; }
  #fxDisc .dR { position: absolute; inset: 0; background: var(--tint); }
  #fxLogo { position: absolute; left: -108px; top: -156px; width: 216px; height: 312px; display: none; }
  #fxLogo img { position: absolute; left: 0; top: 0; width: 216px; height: 312px; will-change: transform; }
  /* ---- 配色スウォッチ（ライブ時のみ・監視リスト右下） ---- */
  .swrow { display: flex; justify-content: flex-end; gap: 7px; margin-top: 10px; }
  .pbtn { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.35); padding: 0; cursor: pointer; }
  #pickViolet { background: #cdc3ee; }
  #pickNavy { background: #1e2542; }
  .pbtn.active { box-shadow: 0 0 0 2px #fff, 0 0 0 3px #8a8578, 0 1px 3px rgba(0,0,0,.35); }
  /* ---- 要確認（v56） ---- */
  .revLink { display: block; background: #fdf3e3; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 13px;
    color: var(--warn); font-weight: 700; text-decoration: none; }
  @media (prefers-color-scheme: dark) { .revLink { background: #3d3220; } }
  .card.review { border: 1.5px dashed var(--warn); position: relative; }
  .card.review .body { padding-right: 24px; }
  .badge.rev { background: var(--warn); color: #fff; }
  .revChev { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 22px; color: var(--sub); padding: 10px 6px; cursor: pointer; }
  .revActions { display: flex; gap: 10px; margin-top: 14px; }
  .revActions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px;
    font-weight: 700; cursor: pointer; }
  .revConfirmBtn { background: var(--accent); color: #fff; border: none; }
  .revDeleteBtn { background: transparent; color: #c0392b; border: 1.5px solid #c0392b; }
  .revMergeBtn { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .revActions button:disabled { opacity: .5; }
  .revWarn { margin-top: 14px; font-size: 13px; font-weight: 700; color: #c0392b; text-align: center; }
  .revDelFinal { background: #c0392b; color: #fff; border: none; }
  /* グループ絞り込み（v86） */
  #groupModal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 300; align-items: center; justify-content: center; }
  #groupModal .gPanel { background: var(--card); border-radius: 14px; width: min(92vw, 420px); overflow: hidden; }
  .gHd { padding: 8px 12px; font-size: 12px; color: var(--sub); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .gCloseBtn { border: none; background: none; color: var(--accent); font-size: 12px; cursor: pointer; }
  #groupModal .gOpts { max-height: 55vh; overflow-y: auto; }
  .gItem { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-size: 14px; border: none; border-bottom: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; text-align: left; }
  .gItem:last-child { border-bottom: none; }
  .gN { color: var(--sub); font-size: 12px; }
  .gCk { color: var(--accent); font-weight: 700; margin-left: 8px; }
  .gFoot { padding: 10px 12px; border-top: 1px solid var(--line); background: var(--card); }
  .gDoneBtn { width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
  #favModal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 300; align-items: center; justify-content: center; }
  #favModal .gPanel { background: var(--card); border-radius: 14px; width: min(92vw, 420px); overflow: hidden; }

  .starBtn { border: none; background: none; cursor: pointer; padding: 2px 4px; }

  .gOpts.dragging-list .gItem.dragging { transition: none; }
  #favModal .gItem { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #favModal .gItem.dragging { position: relative; z-index: 5; background: var(--card); box-shadow: 0 6px 18px rgba(0,0,0,.25); opacity: .95; }
  .mockBanner { background: var(--warn); color: #fff; font-size: 12px; text-align: center; padding: 6px 8px; }
</style>

<script>
var DATA = { candidates: [], lives: [], reviews: [], watchList: [], pendingRequests: [], canEdit: false };
var state = { date: '', site: '', pay: '', suitable: false, past: false, future: false, weekStart: '', group: '' };
var mode = 'sale';
var view = 'list';
var lastNextKey = '';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// 備考の表示用整形: バッジと重複する「未確定（巡回記録）」「テスト向き（推定）」は表示から外す
function dispNote(note) {
  var s = String(note || '');
  s = s.replace(/^未確定（巡回記録）[。\s]*/, '');
  s = s.replace(/。?テスト向き（推定）/g, '');
  s = s.replace(/。?抽選のみ（イベントページで確認）/g, '');
  s = s.replace(/／?旧版から統合/g, '');
  s = s.replace(/／?404エラー/g, '');
  s = s.replace(/^要確認から手動確定[／。\s]*/, '');
  return s.trim();
}

function startOf(c) { return c.saleDate + ' ' + (c.startTime || '00:00'); }

function nextSale() {
  var now = new Date();
  var best = null;
  DATA.candidates.forEach(function (c) {
    if (c.status === '未確定') return;
    var t = new Date(c.saleDate + 'T' + (c.startTime || '00:00') + ':00+09:00');
    if (t <= now) return;
    var rank = c.slot === '主候補' ? 0 : 1;
    if (!best || t < best.t || (t.getTime() === best.t.getTime() && rank < best.rank)) {
      best = { t: t, c: c, rank: rank };
    }
  });
  return best;
}

function nextLive() {
  var t = todayStr();
  var best = null;
  (DATA.lives || []).forEach(function (L) {
    if (!L.eventDate || L.eventDate < t) return;
    if (state.group && !(L.lineupWatch || '').split('、').some(function (g) { return state.group.split('、').indexOf(g) >= 0; })) return;
    if (!best || L.eventDate < best.eventDate) best = L;
  });
  return best;
}

function tick() {
  var hero = document.getElementById('hero');
  if (view === 'review') { hero.style.display = 'none'; return; }
  if (mode === 'live') {
    var nl = nextLive();
    if (!nl) { hero.style.display = 'none'; return; }
    hero.style.display = '';
    document.getElementById('heroLabel').textContent = '次のライブ';
    document.getElementById('count').textContent = nl.eventDate.slice(5).replace('-', '/') +
      '（' + '日月火水木金土'[dWeekday(nl.eventDate)] + '）';
    document.getElementById('nextInfo').textContent =
      (nl.eventName || nl.siteName) + (nl.venue ? ' ／ ' + nl.venue : '');
    return;
  }
  var best = nextSale();
  if (!best) { hero.style.display = 'none'; return; }
  document.getElementById('heroLabel').textContent = '次の販売開始まで';
  hero.style.display = '';
  var diff = best.t - new Date();
  var key = best.c.saleDate + best.c.startTime + best.c.url;
  if (key !== lastNextKey) {
    lastNextKey = key;
    document.getElementById('nextInfo').textContent =
      best.c.saleDate + ' ' + best.c.startTime + ' ' + (best.c.eventName || best.c.siteName);
    renderList();
  }
  var s = Math.floor(diff / 1000);
  var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
      m = Math.floor(s % 3600 / 60), ss = s % 60;
  document.getElementById('count').textContent =
    (d > 0 ? d + '日 ' : '') + ('0' + h).slice(-2) + ':' + ('0' + m).slice(-2) + ':' + ('0' + ss).slice(-2);
}
setInterval(tick, 1000);

function dates() {
  var seen = {}, out = [];
  var src = mode === 'live' ? (DATA.lives || []) : DATA.candidates;
  if (mode === 'live' && state.group) { var selG = state.group.split('、'); src = src.filter(function (L) { return (L.lineupWatch || '').split('、').some(function (g) { return selG.indexOf(g) >= 0; }); }); }
  var key = mode === 'live' ? 'eventDate' : 'saleDate';
  src.forEach(function (c) {
    if (c[key] && !seen[c[key]]) { seen[c[key]] = true; out.push(c[key]); }
  });
  var t = todayStr();
  if (t && !seen[t]) out.push(t);
  return out.sort();
}

function todayStr() {
  return (DATA.now || '').slice(0, 10);
}

function defaultDate(ds) {
  var t = todayStr();
  if (ds.indexOf(t) >= 0) return t;
  for (var i = 0; i < ds.length; i++) { if (ds[i] > t) return ds[i]; }
  return ds[ds.length - 1] || '';
}

function renderTabs() {
  var el = document.getElementById('tabs');
  var ds = dates();
  var t = todayStr();
  var visible;
  if (state.future) {
    var fstart = state.weekStart || dAdd(t, 7);
    visible = [];
    for (var fi = 0; fi < 7; fi++) visible.push(dAdd(fstart, fi));
  } else if (state.past) {
    var start = state.weekStart || dAdd(t, -6);
    visible = [];
    for (var i = 0; i < 7; i++) {
      var dd = dAdd(start, i);
      if (dd > t) break;
      visible.push(dd);
    }
    if (!visible.length) visible = [t];
  } else {
    var win = {};
    for (var k = 0; k < 7; k++) win[dAdd(t, k)] = true;
    if (mode !== 'live' || state.group) {
      ds.forEach(function (d) { if (d >= t) win[d] = true; });
    }
    visible = Object.keys(win).sort();
    if (!visible.length) visible = ds;
  }
  if (!state.date || visible.indexOf(state.date) < 0) {
    state.date = (state.past || state.future) ? (visible[0] || '') : defaultDate(ds);
    if (visible.indexOf(state.date) < 0 && visible.length) state.date = visible[0];
  }
  el.innerHTML = visible.map(function (d) {
    return '<button class="tab' + (d === state.date ? ' active' : '') + '" data-date="' + d + '">' +
      esc(d.slice(5).replace('-', '/')) + '</button>';
  }).join('');
  var hasLater = mode === 'live' && ds.some(function (d) { return d > dAdd(t, 6); });
  if (hasLater) {
    el.innerHTML += '<button class="tab' + (state.future ? ' active' : '') + '" id="laterBtn">以降のライブ</button>';
  }
  Array.prototype.forEach.call(el.querySelectorAll('.tab[data-date]'), function (b) {
    b.addEventListener('click', function () { state.date = b.getAttribute('data-date'); renderTabs(); renderList(); });
  });
  var lb = document.getElementById('laterBtn');
  if (lb) lb.addEventListener('click', openFutureCal);
  var pb = document.getElementById('pastBtn');
  if (pb) {
    var hasPast = ds.some(function (d) { return d < t; });
    pb.style.display = hasPast ? '' : 'none';
    pb.classList.toggle('active', !!state.past);
    pb.textContent = mode === 'live' ? '過去のライブ' : '過去のチケ発';
  }
  var bb = document.getElementById('backBtn');
  if (bb) {
    bb.style.display = (state.past || state.future) ? '' : 'none';
    bb.textContent = mode === 'live' ? 'これからのライブに戻る' : 'これからのチケ発に戻る';
  }
}

function dAdd(ds, n) {
  var p = ds.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
}

function dWeekday(ds) {
  var p = ds.split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
}

var calCursor = '';
var calMode = 'past';

function renderCalendar() {
  var panel = document.getElementById('calPanel');
  var ym = calCursor.split('-');
  var y = +ym[0], m = +ym[1];
  var first = y + '-' + ('0' + m).slice(-2) + '-01';
  var startDow = dWeekday(first);
  var daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  var reg = {};
  dates().forEach(function (d) { reg[d] = true; });
  if (mode === 'live' && state.group) { var selC = state.group.split('、'); var tC = todayStr(); var todayHas = (DATA.lives || []).some(function (L) { return L.eventDate === tC && (L.lineupWatch || '').split('、').some(function (g) { return selC.indexOf(g) >= 0; }); }); if (!todayHas) delete reg[tC]; }
  var t = todayStr();
  var html = '<div class="cal-head"><button id="calPrev">‹</button><span>' + y + '年' + m + '月</span><button id="calNext">›</button></div>';
  html += '<div class="cal-grid">';
  ['日', '月', '火', '水', '木', '金', '土'].forEach(function (w) { html += '<div class="cal-dow">' + w + '</div>'; });
  for (var i = 0; i < startDow; i++) html += '<span class="cal-day empty"></span>';
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = y + '-' + ('0' + m).slice(-2) + '-' + ('0' + d).slice(-2);
    var cls = 'cal-day' + (reg[ds] ? ' has' : '') + (((calMode === 'past' && state.past) || (calMode === 'future' && state.future)) && ds === state.weekStart ? ' sel' : '');
    var dis = (calMode === 'future' ? ds < t : ds > t) ? ' disabled' : '';
    html += '<button class="' + cls + '" data-cal="' + ds + '"' + dis + '>' + d + '</button>';
  }
  html += '</div>';
  panel.innerHTML = html;
  document.getElementById('calPrev').addEventListener('click', function () { shiftMonth(-1); });
  document.getElementById('calNext').addEventListener('click', function () { shiftMonth(1); });
  Array.prototype.forEach.call(panel.querySelectorAll('[data-cal]'), function (b) {
    b.addEventListener('click', function () { pickDate(b.getAttribute('data-cal')); });
  });
}

function shiftMonth(n) {
  var ym = calCursor.split('-');
  var d = new Date(Date.UTC(+ym[0], +ym[1] - 1 + n, 1));
  calCursor = d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2);
  renderCalendar();
}

function pickDate(ds) {
  if (calMode === 'future') { state.future = true; state.past = false; }
  else { state.past = true; state.future = false; }
  state.weekStart = ds;
  state.date = ds;
  document.getElementById('calPanel').style.display = 'none';
  renderTabs();
  renderList();
}

function openFutureCal() {
  var panel = document.getElementById('calPanel');
  if (panel.style.display !== 'none' && calMode === 'future') { panel.style.display = 'none'; return; }
  calMode = 'future';
  calCursor = (state.future && state.weekStart ? state.weekStart : todayStr()).slice(0, 7);
  renderCalendar();
  panel.style.display = '';
}

function bindPast() {
  document.getElementById('pastBtn').addEventListener('click', function () {
    var panel = document.getElementById('calPanel');
    if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
    calMode = 'past';
    calCursor = (state.past && state.weekStart ? state.weekStart : todayStr()).slice(0, 7);
    renderCalendar();
    panel.style.display = '';
  });
  document.getElementById('backBtn').addEventListener('click', function () {
    state.past = false;
    state.future = false;
    state.date = todayStr();
    document.getElementById('calPanel').style.display = 'none';

    renderList();
  });
}

function bindLightbox() {

function visibleCandidates() {
  return DATA.candidates.filter(function (c) {
    if (c.saleDate !== state.date) return false;
    if (state.site && c.site !== state.site) return false;
    if (state.pay) {
      var pm = c.paymentMethod || 'unknown';
      if (pm !== state.pay) return false;
    }
    if (state.suitable && (c.note || '').indexOf('テスト向き') < 0) return false;
    return true;
  }).sort(function (a, b) {
    var ha = (a.startTime || '').slice(0, 2), hb = (b.startTime || '').slice(0, 2);
    if (ha !== hb) return ha < hb ? -1 : 1;
    var sa = a.slot === '主候補' ? 0 : 1, sb = b.slot === '主候補' ? 0 : 1;
    if (sa !== sb) return sa - sb;
    if (a.startTime !== b.startTime) return a.startTime < b.startTime ? -1 : 1;

  var el = document.getElementById('list');

    var hasAny = DATA.candidates.some(function (c) { return c.saleDate === state.date; });

    });

}

var revSwapped = {};

var revMergeArm = {};
var revConfirmArm = {};

    rsHtml = rsHtml.replace(esc(r.successorUrl), '<a href="' + esc(r.successorUrl) + '" target="_blank" rel="noopener">' + esc(r.successorUrl) + '</a>');

  if (DATA.canEdit) {

function goReviewPage(cardEl, key, page) {
  var current = revSwapped[key] ? 1 : 0;
  if (current === page) return;
  revSwapped[key] = page;
  if (!page) {
    revArm[key] = false;
    revMergeArm[key] = false;
    revConfirmArm[key] = false;
    var mArmEl = cardEl.querySelector('.revMergeArm');
    if (mArmEl) mArmEl.style.display = 'none';
    var cArmEl = cardEl.querySelector('.revConfirmArm');
    if (cArmEl) cArmEl.style.display = 'none';
    var acts = cardEl.querySelector('.revActions');
    var arm = cardEl.querySelector('.revArm');
    if (acts) acts.style.display = '';
    if (arm) arm.style.display = 'none';
  }
  var chev = cardEl.querySelector('.revChev');
  if (chev) chev.textContent = page ? '‹' : '›';
  var dots = cardEl.querySelectorAll('.dot');
  Array.prototype.forEach.call(dots, function (dt, i) {
    if (i === page) dt.classList.add('active'); else dt.classList.remove('active');
  });
  var front = cardEl.querySelector('.rFront');
  var back = cardEl.querySelector('.rBack');
  var show = page ? back : front;
  var hide = page ? front : back;
  hide.style.opacity = '0';
  hide.style.transform = 'translateX(' + (page ? '-14px' : '14px') + ')';
  setTimeout(function () {
    hide.style.display = 'none';
    show.style.display = '';
    show.style.opacity = '0';
    show.style.transform = 'translateX(' + (page ? '14px' : '-14px') + ')';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        show.style.opacity = '1';
        show.style.transform = 'translateX(0)';
        setTimeout(function () {
          show.style.opacity = ''; show.style.transform = '';
          hide.style.opacity = ''; hide.style.transform = '';
        }, 200);
      });
    });
  }, 130);
}

    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(r);
  });
  order.sort(function (a, b) { if (a === '') return 1; if (b === '') return -1; return a < b ? -1 : 1; });

  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-rev-del]'), function (b) {

      card.querySelector('.revActions').style.display = 'none';
      card.querySelector('.revArm').style.display = '';

  Array.prototype.forEach.call(el.querySelectorAll('[data-rev-delfinal]'), function (b) {

  Array.prototype.forEach.call(el.querySelectorAll('[data-rev-merge]'), function (b) {

var FX_POLY = [[236, 0], [111, 125], [108.5, 134], [108.5, 186], [104, 192], [6, 296]];
function fxBoltPoints(ox, oy) {
  var pts = FX_POLY.map(function (p) { return [ox + p[0], oy + p[1]]; });
  var f = pts[0], s = pts[1];
  var topY = f[1] - 3000;
  var topX = f[0] + (s[0] - f[0]) * ((topY - f[1]) / (s[1] - f[1]));
  var l = pts[pts.length - 1], q = pts[pts.length - 2];
  var botY = l[1] + 3000;
  var botX = l[0] + (l[0] - q[0]) * ((botY - l[1]) / (l[1] - q[1]));
  pts.unshift([topX, topY]);
  pts.push([botX, botY]);
  return pts;
}
function fxPolyStr(pts, w, h, left) {
  var body = pts.map(function (p) { return (p[0] / w * 100).toFixed(2) + '% ' + (p[1] / h * 100).toFixed(2) + '%'; });
  if (left) return 'polygon(0% 0%, ' + body.join(', ') + ', 0% 100%)';
  return 'polygon(' + body.join(', ') + ', 100% 100%, 100% 0%)';
}
function fxShifted(pts, dx) { return pts.map(function (p) { return [p[0] + dx, p[1]]; }); }
function fxApplyClips() {
  var colL = document.getElementById('colL');
  if (!colL) return;
  var W = window.innerWidth, H = window.innerHeight;
  var pts = fxBoltPoints(W / 2 - 108, H * 0.44 - 156);
  colL.style.clipPath = fxPolyStr(pts, W, H, true);
  document.getElementById('colR').style.clipPath = fxPolyStr(fxShifted(pts, -2), W, H, false);
  var D = 2.6 * Math.max(W, H);
  var dpts = fxBoltPoints(D / 2 - 108, D / 2 - 156);
  document.querySelector('#fxDisc .dL').style.clipPath = 'none';
  document.querySelector('#fxDisc .dR').style.clipPath = fxPolyStr(fxShifted(dpts, -2), D, D, false);
}
window.addEventListener('resize', fxApplyClips);
function fxWait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function runModeTransition(target) {

    var colL = document.getElementById('colL'), colR = document.getElementById('colR');

    var e2 = colR.animate([{ transform: 'translateX(106%)' }, { transform: 'translateX(0)' }], { duration: 500, easing: 'cubic-bezier(.22,.9,.3,1)', fill: 'forwards' });
    var e3 = hL.animate([{ transform: 'translateX(-106vw)' }, { transform: 'translateX(0)' }], { duration: 500, easing: 'cubic-bezier(.22,.9,.3,1)', fill: 'forwards' });
    var e4 = hR.animate([{ transform: 'translateX(106vw)' }, { transform: 'translateX(0)' }], { duration: 500, easing: 'cubic-bezier(.22,.9,.3,1)', fill: 'forwards' });
    await Promise.all([e1.finished, e2.finished, e3.finished, e4.finished]);
    await fxWait(60);
    hL.style.display = 'none'; hR.style.display = 'none'; full.style.display = 'block';
    setMode(target);
    colL.style.display = 'none'; colR.style.display = 'none';
    disc.style.display = 'block';
    var s1 = rotator.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 700, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'forwards' });
    await s1.finished;
    await fxWait(40);
    full.style.display = 'none'; hL.style.display = ''; hR.style.display = '';
    disc.style.display = 'none';
    colL.style.display = 'block'; colR.style.display = 'block';
    var x1 = colL.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-106%)' }], { duration: 650, easing: 'cubic-bezier(.55,.06,.68,.4)', fill: 'forwards' });
    var x2 = colR.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(106%)' }], { duration: 650, easing: 'cubic-bezier(.55,.06,.68,.4)', fill: 'forwards' });
    var x3 = hL.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-106vw)' }], { duration: 650, easing: 'cubic-bezier(.55,.06,.68,.4)', fill: 'forwards' });
    var x4 = hR.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(106vw)' }], { duration: 650, easing: 'cubic-bezier(.55,.06,.68,.4)', fill: 'forwards' });
    await Promise.all([x1.finished, x2.finished, x3.finished, x4.finished]);
    fx.classList.remove('on');
  } catch (err) {
    fx.classList.remove('on');
  }
  fxBusy = false;
}

  var sel = selectedGroups_();
  var names = Object.keys(counts).sort(function (a, b) { return a.localeCompare(b, 'ja'); });
  var h = '<button type="button" class="gItem" data-g=""><span>すべて</span><span><span class="gN">' + (DATA.lives || []).length + '件</span>' + (sel.length ? '' : '<span class="gCk">✓</span>') + '</span></button>';
  var favs = favGroups_();
  var ordered = favs.filter(function (g) { return names.indexOf(g) >= 0; }).concat(names.filter(function (g) { return favs.indexOf(g) < 0; }));
  ordered.forEach(function (g) {
    h += '<button type="button" class="gItem" data-g="' + esc(g) + '"><span>' + (favs.indexOf(g) >= 0 ? '<span class="gFav">★</span>' : '') + esc(g) + '</span><span><span class="gN">' + counts[g] + '件</span>' + (sel.indexOf(g) >= 0 ? '<span class="gCk">✓</span>' : '') + '</span></button>';
  });
  return h;
}
function bindGroupItems_() {
  var c = document.getElementById('groupModal');
  Array.prototype.forEach.call(c.querySelectorAll('.gItem'), function (it) {
    it.addEventListener('click', function () { toggleGroup_(it.getAttribute('data-g')); });
  });
}
function renderGroupBtn_() {
  var sel = selectedGroups_();
  var label = !sel.length ? 'すべて' : (sel.length === 1 ? sel[0] : sel[0] + ' +' + (sel.length - 1));
  document.getElementById('groupBtn').textContent = 'グループ: ' + label + ' ▼';
}
function refreshGroupModal_() {
  var c = document.getElementById('groupModal');
  c.querySelector('.gOpts').innerHTML = groupItemsHtml_();
  bindGroupItems_();
  var n = selectedGroups_().length;
  c.querySelector('.gDoneBtn').textContent = n ? '決定（' + n + 'グループ選択中）' : '決定';
  renderGroupBtn_();
}
function toggleGroup_(g) {
  if (!g) { state.group = ''; }
  else {
    var sel = selectedGroups_();
    var i = sel.indexOf(g);
    if (i >= 0) sel.splice(i, 1); else sel.push(g);
    state.group = sel.join('、');
  }
  refreshGroupModal_();
}
function applyGroup_() {
  document.getElementById('groupModal').style.display = 'none';
  state.date = '';
  if (state.group) { var sel = selectedGroups_(); var fut = (DATA.lives || []).filter(function (L) { return L.eventDate >= todayStr() && (L.lineupWatch || '').split('、').some(function (g) { return sel.indexOf(g) >= 0; }); }).map(function (L) { return L.eventDate; }).sort(); if (fut.length) state.date = fut[0]; }
  renderGroupBtn_(); renderTabs(); renderList(); tick();
}
function openGroupModal_() {
  var c = document.getElementById('groupModal');
  if (c.style.display !== 'none') { applyGroup_(); return; }
  c.style.display = 'flex';
  refreshGroupModal_();
}
(function () {
  var c = document.getElementById('groupModal');
  c.addEventListener('click', function (ev) { if (ev.target === c) applyGroup_(); });
  c.querySelector('.gCloseBtn').addEventListener('click', applyGroup_);
  c.querySelector('.gDoneBtn').addEventListener('click', applyGroup_);
  document.getElementById('groupBtn').addEventListener('click', openGroupModal_);
  renderGroupBtn_();
})();
</script>
<script>
// ===== お気に入り登録 =====
function favGroups_() { try { var v = JSON.parse(localStorage.getItem("ticketListFavGroups") || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function saveFavGroups_(arr) { try { localStorage.setItem("ticketListFavGroups", JSON.stringify(arr)); } catch (e) {} }
function favItemsHtml_() {
  var counts = groupCounts_();
  var favs = favGroups_();
  var names = Object.keys(counts).sort(function (a, b) { return a.localeCompare(b, "ja"); });
  if (!names.length) return '<div class="gItem">対象がありません</div>';
  var ordered = favs.filter(function (g) { return names.indexOf(g) >= 0; }).concat(names.filter(function (g) { return favs.indexOf(g) < 0; }));
  return ordered.map(function (g, idx) {
    var on = favs.indexOf(g) >= 0;
    return '<div class="gItem"><span>' + esc(g) + '</span><span><span class="gN">' + counts[g] + '件</span><button type="button" class="starBtn" data-fav="' + esc(g) + '"><span class="favStar' + (on ? " on" : "") + '">' + (on ? "★" : "☆") + '</span></button></span></div>';
  }).join("");
}
function renderFav_() { document.querySelector("#favModal .gOpts").innerHTML = favItemsHtml_(); }
function openFavModal_() { renderFav_(); document.getElementById("favModal").style.display = "flex"; }
function closeFavModal_() { document.getElementById("favModal").style.display = "none"; }
document.getElementById("favBtn").addEventListener("click", openFavModal_);
document.querySelector("#favModal .gCloseBtn").addEventListener("click", closeFavModal_);
document.getElementById("favDone").addEventListener("click", closeFavModal_);
document.getElementById("favModal").addEventListener("click", function (e) { if (e.target === this) closeFavModal_(); });
document.querySelector("#favModal .gOpts").addEventListener("click", function (e) {
  var tg = e.target.closest("[data-fav]");
  if (!tg) return;
  var favs = favGroups_();
  var g = tg.getAttribute("data-fav");
  var i = favs.indexOf(g);
  if (i >= 0) favs.splice(i, 1); else favs.push(g);
  saveFavGroups_(favs);
  renderFav_();
});
// ===== お気に入りの長押しドラッグ並べ替え（タッチイベント方式） =====
(function () {
  var box = document.querySelector("#favModal .gOpts");
  var drag = null;
  box.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  box.addEventListener("touchstart", function (e) {
    if (e.target.closest("button")) return;
    var row = e.target.closest(".gItem");
    if (!row) return;
    var star = row.querySelector("[data-fav]");
    if (!star) return;
    var g = star.getAttribute("data-fav");
    var favs = favGroups_();
    var idx = favs.indexOf(g);
    if (idx < 0) return;
    var startY = e.touches[0].clientY;
    var rowH = row.offsetHeight || 45;
    var state = { pending: true, timer: null };
    state.timer = setTimeout(function () {
      state.pending = false;
      var allRows = Array.prototype.slice.call(box.querySelectorAll(".gItem"));
      drag = { g: g, idx: idx, startY: startY, rowH: rowH, row: row, dy: 0, target: idx, rows: allRows.slice(0, favs.length) };
      row.classList.add("dragging");
      box.classList.add("dragging-list");
    }, 350);
    function cleanup() {
      document.removeEventListener("touchmove", onMove);
      document.removeEventListener("touchend", onUp);
      document.removeEventListener("touchcancel", onUp);
    }
    function onMove(ev) {
      var y = ev.touches[0].clientY;
      if (state.pending) {
        if (Math.abs(y - startY) > 10) { clearTimeout(state.timer); cleanup(); }
        return;
      }
      if (!drag) return;
      ev.preventDefault();
      var dy = y - drag.startY;
      var maxUp = -drag.idx * drag.rowH;
      var maxDn = (favGroups_().length - 1 - drag.idx) * drag.rowH;
      dy = Math.max(maxUp, Math.min(maxDn, dy));
      drag.dy = dy;
      drag.row.style.transform = "translateY(" + dy + "px)";
      drag.target = Math.max(0, Math.min(favGroups_().length - 1, drag.idx + Math.round(dy / drag.rowH)));
      for (var j = 0; j < drag.rows.length; j++) {
        if (j === drag.idx) continue;
        var off = 0;
        if (drag.target > drag.idx && j > drag.idx && j <= drag.target) off = -drag.rowH;
        else if (drag.target < drag.idx && j < drag.idx && j >= drag.target) off = drag.rowH;
        drag.rows[j].style.transform = off ? "translateY(" + off + "px)" : "";
      }
    }
    function onUp() {
      clearTimeout(state.timer);
      cleanup();
      if (drag) {
        var favs2 = favGroups_();
        var from = favs2.indexOf(drag.g);
        var to = drag.target;
        if (from >= 0 && to !== from) { favs2.splice(from, 1); favs2.splice(to, 0, drag.g); saveFavGroups_(favs2); }
        drag = null;
        box.classList.remove("dragging-list");
        renderFav_();
      }
    }
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("touchend", onUp);
    document.addEventListener("touchcancel", onUp);
  }, { passive: true });
})();
</script>
</body>
