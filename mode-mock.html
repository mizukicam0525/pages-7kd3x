<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>切替モック（タッチ確認用）</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#23241f; --sub:#6d6a5e;
    --line:#e3ded2; --accent:#b3541e; --soft:#f7e8dd; --chip:#efece3;
    --cream:#f6f4ef; --tint:#1e2542;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;}
  .wrap{max-width:880px; margin:0 auto; padding:16px 14px 110px;}
  header h1{font-size:20px; margin:4px 0 2px;}
  .headrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .modeBtn{margin-left:auto; border:1px solid var(--line); background:var(--chip);
    color:var(--ink); border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer;}
  .updated{color:var(--sub); font-size:12px; margin-top:2px;}
  .note{color:var(--sub); font-size:11px; line-height:1.6; margin-top:4px;}
  .hero{background:var(--soft); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-top:10px;}
  .hero .label{font-size:12px; color:var(--sub);}
  .hero .big{font-size:19px; font-weight:700; margin-top:2px;}
  .tabs{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .tab{border:1px solid var(--line); background:var(--card); border-radius:8px;
    padding:6px 10px; font-size:12px;}
  .tab.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;}
  .chips{display:flex; gap:5px; margin-top:10px; flex-wrap:wrap;}
  .fchip{border:1px solid var(--line); background:var(--chip); border-radius:999px;
    padding:4px 10px; font-size:11px;}
  .fchip.active{background:var(--ink); color:var(--bg);}
  .slot{font-size:13px; font-weight:700; color:var(--sub); margin:16px 0 6px;}
  .card{display:flex; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:10px; margin-bottom:10px;}
  .time{font-size:19px; font-weight:700;}
  .datelab{font-size:10px; color:var(--sub);}
  .poster{width:42px; height:56px; border-radius:4px; background:#d9d4c7; margin-top:6px;}
  .badges{display:flex; gap:4px; flex-wrap:wrap;}
  .badge{font-size:10px; font-weight:700; border-radius:999px; padding:2px 7px;}
  .badge.main{background:var(--accent); color:#fff;}
  .badge.site{background:var(--soft); color:var(--accent);}
  .name{font-size:14px; font-weight:700; margin-top:4px; line-height:1.4;}
  .meta{font-size:11px; color:var(--sub); margin-top:2px; line-height:1.5;}
  /* ---- live-mode themes (destination tone follows the picker) ---- */
  body.live.violet{ background:#f0eef7; --accent:#5a4ea8; --soft:#e6e1f5; --chip:#e9e6f2; }
  body.live.navy{ background:#1e2542; --accent:#5b8cff; --soft:#2d3a68; --chip:#2a3358; }
  body.live.navy h1{ color:#f2f4ff; }
  body.live.navy .updated, body.live.navy .note, body.live.navy .slot{ color:#a8b2d4; }
  body.live.navy .hero{ background:#2d3a68; border-color:#3d4a7d; }
  body.live.navy .hero .label{ color:#a8b2d4; }
  body.live.navy .hero .big{ color:#f2f4ff; }
  body.live.navy .modeBtn{ background:#2a3358; border-color:#3d4a7d; color:#f2f4ff; }
  body.live.navy .tab{ border-color:#3d4a7d; }
  /* ---- transition overlay ---- */
  #fx{position:fixed; inset:0; overflow:hidden; pointer-events:none; display:none; z-index:50;}
  #fx.on{display:block;}
  .colPanel{position:absolute; top:0; bottom:0; width:100%; will-change:transform;}
  #colL{background:var(--cream);
    clip-path:polygon(0 0, 54% 0, 54% 38%, 46% 62%, 46% 100%, 0 100%);}
  #colR{background:var(--tint);
    clip-path:polygon(54% 0, 100% 0, 100% 100%, 46% 100%, 46% 62%, 54% 38%);}
  #disc{position:absolute; width:260vmax; height:260vmax; left:50%; top:50%;
    margin-left:-130vmax; margin-top:-130vmax; display:none; will-change:transform;}
  #disc .dL{position:absolute; inset:0; background:var(--cream);
    clip-path:polygon(0 0, 52% 0, 52% 38%, 48% 62%, 48% 100%, 0 100%);}
  #disc .dR{position:absolute; inset:0; background:var(--tint);
    clip-path:polygon(52% 0, 100% 0, 100% 100%, 48% 100%, 48% 62%, 52% 38%);}
  #logoLayer{position:absolute; left:50%; top:44%; width:216px; height:312px;
    margin-left:-108px; margin-top:-156px; display:none; will-change:transform;}
  #logoLayer img{position:absolute; left:0; top:0; width:216px; height:312px; will-change:transform;}
  /* ---- color picker bar ---- */
  #picker{position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.94);
    border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:8px; align-items:center; z-index:60;}
  #picker .plabel{font-size:12px; color:var(--sub);}
  .pbtn{border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:7px 14px; font-size:13px; cursor:pointer;}
  .pbtn.active{background:var(--ink); color:#fff; font-weight:700;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div id="fx">
  <div class="colPanel" id="colL"></div>
  <div class="colPanel" id="colR"></div>
  <div id="disc"><div class="dL"></div><div class="dR"></div></div>
  <div id="logoLayer">
    <img id="halfL" alt="">
    <img id="halfR" alt="">
  </div>
</div>

<div id="picker">
  <span class="plabel">切り替え色:</span>
  <button class="pbtn" id="pickNavy">ネイビー</button>
  <button class="pbtn" id="pickViolet">紫</button>
</div>

var mode = 'sale';
var busy = false;
var app = document.getElementById('app');
app.innerHTML = SALE_HTML;

var tintName = 'navy';
function applyBodyClass(){
  document.body.className = (mode === 'live') ? ('live ' + tintName) : '';
}
function setTint(color, btn){
  tintName = btn;
  document.documentElement.style.setProperty('--tint', color);
  document.getElementById('pickNavy').classList.toggle('active', btn==='navy');
  document.getElementById('pickViolet').classList.toggle('active', btn==='violet');
  applyBodyClass();
}
document.getElementById('pickNavy').onclick = function(){ setTint('#1e2542','navy'); };
document.getElementById('pickViolet').onclick = function(){ setTint('#bdb1e2','violet'); };
setTint('#1e2542','navy');

function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

async function switchMode(){
  if (busy) return;
  busy = true;
  var fx = document.getElementById('fx');
  var colL = document.getElementById('colL'), colR = document.getElementById('colR');
  var disc = document.getElementById('disc'), logo = document.getElementById('logoLayer');
  var hL = document.getElementById('halfL'), hR = document.getElementById('halfR');
  fx.classList.add('on');
  colL.style.display='block'; colR.style.display='block';
  disc.style.display='none'; logo.style.display='block';
  hL.style.transform=''; hR.style.transform=''; logo.style.transform='';

  /* enter (~0.5s): colors + halves slide in */
  var e1 = colL.animate([{transform:'translateX(-106%)'},{transform:'translateX(0)'}],{duration:500,easing:'cubic-bezier(.22,.9,.3,1)',fill:'forwards'});
  var e2 = colR.animate([{transform:'translateX(106%)'},{transform:'translateX(0)'}],{duration:500,easing:'cubic-bezier(.22,.9,.3,1)',fill:'forwards'});
  var e3 = hL.animate([{transform:'translateX(-62vw)'},{transform:'translateX(0)'}],{duration:500,easing:'cubic-bezier(.22,.9,.3,1)',fill:'forwards'});
  var e4 = hR.animate([{transform:'translateX(62vw)'},{transform:'translateX(0)'}],{duration:500,easing:'cubic-bezier(.22,.9,.3,1)',fill:'forwards'});
  await Promise.all([e1.finished, e2.finished, e3.finished, e4.finished]);
  await wait(60);

  /* swap content under the colors */
  mode = (mode === 'sale') ? 'live' : 'sale';
  app.innerHTML = (mode === 'sale') ? SALE_HTML : LIVE_HTML;
  applyBodyClass();

  /* spin (~0.7s): disc + logo rotate clockwise together */
  colL.style.display='none'; colR.style.display='none';
  disc.style.display='block';
  var s1 = disc.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:700,easing:'cubic-bezier(.45,.05,.35,1)',fill:'forwards'});
  var s2 = logo.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:700,easing:'cubic-bezier(.45,.05,.35,1)',fill:'forwards'});
  await Promise.all([s1.finished, s2.finished]);
  await wait(40);

  /* exit (~0.45s): colors leave with the halves, destination revealed from the center */
  disc.style.display='none';
  colL.style.display='block'; colR.style.display='block';
  var x1 = colL.animate([{transform:'translateX(0)'},{transform:'translateX(-106%)'}],{duration:450,easing:'cubic-bezier(.55,.06,.68,.4)',fill:'forwards'});
  var x2 = colR.animate([{transform:'translateX(0)'},{transform:'translateX(106%)'}],{duration:450,easing:'cubic-bezier(.55,.06,.68,.4)',fill:'forwards'});
  var x3 = hL.animate([{transform:'translateX(0)'},{transform:'translateX(-62vw)'}],{duration:450,easing:'cubic-bezier(.55,.06,.68,.4)',fill:'forwards'});
  var x4 = hR.animate([{transform:'translateX(0)'},{transform:'translateX(62vw)'}],{duration:450,easing:'cubic-bezier(.55,.06,.68,.4)',fill:'forwards'});
  await Promise.all([x1.finished, x2.finished, x3.finished, x4.finished]);

  fx.classList.remove('on');
  busy = false;
}
