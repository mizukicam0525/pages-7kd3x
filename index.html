<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>チケ発リスト</title>
<link rel="icon" href="https://lh3.googleusercontent.com/d/1PkHKs4vxoUjZYqYXtMXvz15xWdDNOvAu?x=icon.png">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1PkHKs4vxoUjZYqYXtMXvz15xWdDNOvAu?x=icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="チケ発リスト">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="app" title="チケ発リスト"></iframe>
<script>
  // ライブ側テーマ色の保持は、このページ（表示側）の保存領域で行う。
  // アプリ本体は iframe 内のため端末側保存が制限されるので、保存済みの色を
  // 起動時に URL で渡し、色が変わったら postMessage で受け取って保存する。
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxTCTIc1kD4SCMIhleVNRoxdDc3Gf0Ir1KEZUbI5T_UhCmLAoiy7jCCgPVJl-BNzZ5eqQ/exec';
  var tint = '';
  try { tint = localStorage.getItem('ticketListTint') || ''; } catch (e) {}
  if (tint !== 'violet' && tint !== 'navy') tint = '';
  document.getElementById('app').src = EXEC_URL + (tint ? '?tint=' + tint : '');
  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/script\.googleusercontent\.com$/.test(host)) return;
    var v = e.data && e.data.ticketListTint;
    if (v === 'violet' || v === 'navy') {
      try { localStorage.setItem('ticketListTint', v); } catch (err) {}
    }
  });
</script>
</body>
</html>
