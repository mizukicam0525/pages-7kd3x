  html, body { margin: 0; padding: 0; height: 100%; background: #121630; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  /* 読み込み画面: まずアプリアイコンを表示し、その上からモード切替と
     同じ動き（両端から色パネルとロゴ半分が入って合体→回転）で覆う。

     表示の準備ができたら、回転が元の向きに戻る切れ目で分かれて開く。 */
  #splash { position: fixed; inset: 0; z-index: 10; overflow: hidden; }
  #splashBase { position: absolute; inset: 0;
    background: linear-gradient(180deg, #364070 0%, #121630 100%); }
  #splashTile { position: absolute; left: 50%; top: 44%; width: 46%;
    transform: translate(-50%, -50%); border-radius: 22.37%;

  .colPanel { position: absolute; top: 0; bottom: 0; width: 100%; will-change: transform; }
  #spColL { background: #f6f4ef; display: none; }
  #spColR { background: #cdc3ee; display: none; }
  #spRotator { position: absolute; left: 50%; top: 44%; width: 0; height: 0; will-change: transform; }
  #spDisc { position: absolute; width: 260vmax; height: 260vmax; left: -130vmax; top: -130vmax; display: none; }
  #spDisc .dL { position: absolute; inset: 0; background: #f6f4ef; }
  #spDisc .dR { position: absolute; inset: 0; background: #cdc3ee; }
  #spLogo { position: absolute; left: -108px; top: -156px; width: 216px; height: 312px; visibility: hidden; }
  #spLogo img { position: absolute; left: 0; top: 0; width: 216px; height: 312px; will-change: transform; }

<script>
  // ライブ側テーマ色の保持は、このページ（表示側）の保存領域で行う。
  // アプリ本体は iframe 内のため端末側保存が制限されるので、保存済みの色を
  // 起動時に URL で渡し、色が変わったら postMessage で受け取って保存する。
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxTCTIc1kD4SCMIhleVNRoxdDc3Gf0Ir1KEZUbI5T_UhCmLAoiy7jCCgPVJl-BNzZ5eqQ/exec';
  var tint = '';
  try { tint = localStorage.getItem('ticketListTint') || ''; } catch (e) {}
  if (tint !== 'violet' && tint !== 'navy') tint = '';
  var appFrame = document.getElementById('app');
  appFrame.src = EXEC_URL + (tint ? '?tint=' + tint : '');

  // ===== 読み込み画面（本体のモード切替アニメーションと同構造） =====
  var SP_POLY = [[236, 0], [111, 125], [108.5, 134], [108.5, 186], [104, 192], [6, 296]];
  var SP_TINTS = { violet: '#cdc3ee', navy: '#1e2542' };
  var spTintColor = SP_TINTS[tint] || SP_TINTS.violet;
  var splash = document.getElementById('splash');
  var spBase = document.getElementById('splashBase');
  var spColL = document.getElementById('spColL');
  var spColR = document.getElementById('spColR');
  var spRot = document.getElementById('spRotator');
  var spDisc = document.getElementById('spDisc');
  var spDL = spDisc.querySelector('.dL');
  var spDR = spDisc.querySelector('.dR');
  var spLogo = document.getElementById('spLogo');
  var spHalfL = document.getElementById('spHalfL');
  var spHalfR = document.getElementById('spHalfR');
  var spFull = document.getElementById('spFull');
  spColR.style.background = spTintColor;
  spDR.style.background = spTintColor;

  function spBoltPoints(ox, oy) {
    var pts = SP_POLY.map(function (p) { return [ox + p[0], oy + p[1]]; });
    var f = pts[0], s = pts[1];
    var topY = f[1] - 3000;
    var topX = f[0] + (s[0] - f[0]) * ((topY - f[1]) / (s[1] - f[1]));
    var l = pts[pts.length - 1], q = pts[pts.length - 2];
    var botY = l[1] + 3000;
    var botX = l[0] + (l[0] - q[0]) * ((botY - l[1]) / (l[1] - q[1]));
    pts.unshift([topX, topY]);
    pts.push([botX, botY]);
    return pts;
  }
  function spPolyStr(pts, w, h, left) {
    var body = pts.map(function (p) { return (p[0] / w * 100).toFixed(2) + '% ' + (p[1] / h * 100).toFixed(2) + '%'; });
    if (left) return 'polygon(0% 0%, ' + body.join(', ') + ', 0% 100%)';
    return 'polygon(' + body.join(', ') + ', 100% 100%, 100% 0%)';
  }
  function spShifted(pts, dx) { return pts.map(function (p) { return [p[0] + dx, p[1]]; }); }
  function spApplyClips() {
    var W = window.innerWidth, H = window.innerHeight;
    var pts = spBoltPoints(W / 2 - 108, H * 0.44 - 156);
    spColL.style.clipPath = spPolyStr(pts, W, H, true);
    spColR.style.clipPath = spPolyStr(spShifted(pts, -2), W, H, false);
    var D = 2.6 * Math.max(W, H);
    var dpts = spBoltPoints(D / 2 - 108, D / 2 - 156);
    spDL.style.clipPath = 'none';
    spDR.style.clipPath = spPolyStr(spShifted(dpts, -2), D, D, false);
  }
  spApplyClips();
  window.addEventListener('resize', spApplyClips);

  var SPIN_MS = 700;
  var spPhase = 'base'; // base -> entering -> spinning -> exiting -> done
  var spReady = false;
  function spWait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function spEnter() {
    if (spPhase !== 'base') return;
    if (!Element.prototype.animate) { splash.style.display = 'none'; spPhase = 'done'; return; }
    spPhase = 'entering';
    spApplyClips();
    spColL.style.display = 'block'; spColR.style.display = 'block';
    spDisc.style.display = 'none'; spLogo.style.visibility = 'visible';
    spFull.style.display = 'none'; spHalfL.style.display = ''; spHalfR.style.display = '';
    spHalfL.style.transform = ''; spHalfR.style.transform = '';
    var ease = 'cubic-bezier(.22,.9,.3,1)';
    var e1 = spColL.animate([{ transform: 'translateX(-106%)' }, { transform: 'translateX(0)' }], { duration: 500, easing: ease, fill: 'forwards' });
    var e2 = spColR.animate([{ transform: 'translateX(106%)' }, { transform: 'translateX(0)' }], { duration: 500, easing: ease, fill: 'forwards' });
    var e3 = spHalfL.animate([{ transform: 'translateX(-106vw)' }, { transform: 'translateX(0)' }], { duration: 500, easing: ease, fill: 'forwards' });
    var e4 = spHalfR.animate([{ transform: 'translateX(106vw)' }, { transform: 'translateX(0)' }], { duration: 500, easing: ease, fill: 'forwards' });
    await Promise.all([e1.finished, e2.finished, e3.finished, e4.finished]);
    await spWait(60);
    spHalfL.style.display = 'none'; spHalfR.style.display = 'none'; spFull.style.display = 'block';
    spColL.style.display = 'none'; spColR.style.display = 'none';
    spDisc.style.display = 'block';
    spBase.style.display = 'none';
    spPhase = 'spinning';
    spSpinTurn();
  }

  // 回転は本体と同じく WAAPI で1回転ずつ回す。1回転が終わると回転側が
  // 360度（=正立）の姿勢を保持したまま止まるので、クラスを外して止める
  // 方式で起きていた「次の回転へ数フレーム進んでから0度へ戻る」画戻りが
  // 出ない。準備ができていなければ次の1回転を続け、できていれば退場する。
  function spSpinTurn() {
    if (spPhase !== 'spinning') return;
    var a = spRot.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: SPIN_MS, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'forwards' });
    a.finished.then(async function () {
      if (spPhase !== 'spinning') return;
      // 1回転ごとに正立で静止させる。姿勢を通常のスタイルとして確定して
      // からアニメーションを畳むので、終了通知と描画のタイミングがずれても
      // 逆向きに戻ることはない。静止の間合いを置いてから次へ進む。
      spRot.style.transform = 'rotate(0deg)';
      a.cancel();
      if (spReady) { spBeginExit(); return; }
      await spWait(120);
      if (spPhase !== 'spinning') return;
      spSpinTurn();
    }, function () {
      // アニメーションが中断された場合は塞ぎ続けずに開く。
      if (spPhase === 'spinning') { splash.style.display = 'none'; spPhase = 'done'; }
    });
  }

  async function spBeginExit() {
    if (spPhase !== 'spinning') return;
    spPhase = 'exiting';
    spFull.style.display = 'none'; spHalfL.style.display = ''; spHalfR.style.display = '';
    spDisc.style.display = 'none';
    spColL.style.display = 'block'; spColR.style.display = 'block';
    var ease = 'cubic-bezier(.55,.06,.68,.4)';
    var x1 = spColL.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-106%)' }], { duration: 650, easing: ease, fill: 'forwards' });
    var x2 = spColR.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(106%)' }], { duration: 650, easing: ease, fill: 'forwards' });
    var x3 = spHalfL.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-106vw)' }], { duration: 650, easing: ease, fill: 'forwards' });
    var x4 = spHalfR.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(106vw)' }], { duration: 650, easing: ease, fill: 'forwards' });
    await Promise.all([x1.finished, x2.finished, x3.finished, x4.finished]);
    splash.style.display = 'none';
    spPhase = 'done';
  }

  function spMarkReady() {
    if (spReady || spPhase === 'done' || spPhase === 'exiting') return;
    spReady = true;
    // 回転中なら、いまの1回転が終わる切れ目で退場する（spSpinTurn が見る）。
    // base／entering の間は入場が終わってから、最初の1回転の切れ目で退場する。
  }
  // まずアプリアイコンだけを見せ、そのあと両側から覆うように入場する。
  setTimeout(spEnter, 900);
  // 保険: 本体からの合図が来なくても、読み込み画面で塞ぎ続けない。
  var loadFallbackSet = false;
  appFrame.addEventListener('load', function () {
    if (loadFallbackSet) return;
    loadFallbackSet = true;
    setTimeout(spMarkReady, 12000);
  });
  setTimeout(function () {
    if (spPhase !== 'done') { splash.style.display = 'none'; spPhase = 'done'; }
  }, 30000);

  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/script\.googleusercontent\.com$/.test(host)) return;
    var v = e.data && e.data.ticketListTint;
    if (v === 'violet' || v === 'navy') {
      try { localStorage.setItem('ticketListTint', v); } catch (err) {}
    }
    // 前回データの即時表示用: 本体から届いた前回データを保存し、
    // 起動時に本体から求められたら保存分を送り返す。
    if (e.data && e.data.ticketListCacheSave) {
      try { localStorage.setItem('ticketListCache', e.data.ticketListCacheSave); } catch (err) {}
    }
    if (e.data && e.data.ticketListCacheRequest && e.source) {
      var c = '';
      try { c = localStorage.getItem('ticketListCache') || ''; } catch (err) {}
      if (c) { try { e.source.postMessage({ ticketListCacheData: c }, '*'); } catch (err) {} }
    }
    // 本体の初回表示ができたら、読み込み画面の退場を開始する。
    if (e.data && e.data.ticketListReady) spMarkReady();
  });
</script>
