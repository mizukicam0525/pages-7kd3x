<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #121630; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  /* 読み込み画面: 起動画面（紺＋アイコン）の上に、モード切替と同じ動き
     （両端から色とロゴ半分が入って合体→回転）を読み込み中ずっと続け、
     表示の準備ができたら回転が元の向きに戻る切れ目で分かれて退場する。 */
  #splash { position: fixed; inset: 0; z-index: 10; overflow: hidden; }
  #splashBase { position: absolute; inset: 0;
    background: linear-gradient(180deg, #364070 0%, #121630 100%); }
  #splashTile { position: absolute; left: 50%; top: 44%; width: 46%;
    transform: translate(-50%, -50%); border-radius: 22.37%;
    box-shadow: 0 10px 34px rgba(0,0,0,.45); display: block; }
  .colPanel { position: absolute; inset: 0; will-change: transform; }
  #spColL { background: #f6f4ef; }
  #spColR { background: #cdc3ee; }
  #spRotator { position: absolute; left: 50%; top: 44%; width: 0; height: 0; }
  #spDisc { position: absolute; left: 0; top: 0; width: 260vmax; height: 260vmax;
    transform: translate(-50%, -50%); border-radius: 50%; overflow: hidden; }
  #spDisc .dHalf { position: absolute; inset: 0; }
  #spDisc .dL { background: #f6f4ef; }
  #spDisc .dR { background: #cdc3ee; }
  #spDiscFull { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; display: none; }
  #spDiscFull .fL { position: absolute; inset: 0; background: #f6f4ef; }
  #spDiscFull .fR { position: absolute; inset: 0; background: #cdc3ee; }
  #spLogo { position: absolute; left: 0; top: 0; width: min(52vw, 230px);
    aspect-ratio: 216 / 312; transform: translate(-50%, -50%); }
  #spLogo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #spFull { visibility: hidden; }
  .spinning { animation: spSpin .7s cubic-bezier(.45,.05,.35,1) infinite; }
  @keyframes spSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>

<script>
  // ライブ側テーマ色の保持は、このページ（表示側）の保存領域で行う。
  // アプリ本体は iframe 内のため端末側保存が制限されるので、保存済みの色を
  // 起動時に URL で渡し、色が変わったら postMessage で受け取って保存する。
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxTCTIc1kD4SCMIhleVNRoxdDc3Gf0Ir1KEZUbI5T_UhCmLAoiy7jCCgPVJl-BNzZ5eqQ/exec';
  var tint = '';
  try { tint = localStorage.getItem('ticketListTint') || ''; } catch (e) {}
  if (tint !== 'violet' && tint !== 'navy') tint = '';
  var appFrame = document.getElementById('app');
  appFrame.src = EXEC_URL + (tint ? '?tint=' + tint : '');

  // ===== 読み込み画面（モード切替アニメーションの移植） =====
  var SP_POLY = [[236, 0], [111, 125], [108.5, 134], [108.5, 186], [104, 192], [6, 296]];
  var SP_TINTS = { violet: '#cdc3ee', navy: '#1e2542' };
  var spTintColor = SP_TINTS[tint] || SP_TINTS.violet;
  var splash = document.getElementById('splash');
  var spBase = document.getElementById('splashBase');
  var spColL = document.getElementById('spColL');
  var spColR = document.getElementById('spColR');
  var spRot = document.getElementById('spRotator');
  var spDisc = document.getElementById('spDisc');
  var spDL = spDisc.querySelector('.dL');
  var spDR = spDisc.querySelector('.dR');
  var spDiscFull = document.getElementById('spDiscFull');
  var spFR = spDiscFull.querySelector('.fR');
  var spHalfL = document.getElementById('spHalfL');
  var spHalfR = document.getElementById('spHalfR');
  var spFull = document.getElementById('spFull');
  spColR.style.background = spTintColor;
  spDR.style.background = spTintColor;
  spFR.style.background = spTintColor;

  function spBoltPoints(ox, oy) {
    var pts = SP_POLY.map(function (p) { return [ox + p[0], oy + p[1]]; });
    var f = pts[0], s = pts[1];
    var topY = f[1] - 3000, topX = f[0] + (s[0] - f[0]) * ((topY - f[1]) / (s[1] - f[1]));
    var l = pts[pts.length - 1], q = pts[pts.length - 2];
    var botY = l[1] + 3000, botX = l[0] + (l[0] - q[0]) * ((botY - l[1]) / (l[1] - q[1]));
    return [[topX, topY]].concat(pts, [[botX, botY]]);
  }
  function spPolyStr(pts) {
    return 'polygon(' + pts.map(function (p) { return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(',') + ')';
  }
  function spShifted(pts, dx) {
    return pts.map(function (p) { return [p[0] + dx, p[1]]; });
  }
  function spApplyClips() {
    var w = window.innerWidth, h = window.innerHeight;
    var dsPx = Math.max(w, h) * 2.6;
    spDisc.style.width = dsPx + 'px';
    spDisc.style.height = dsPx + 'px';
    var scr = spBoltPoints(w / 2 - 108, h * 0.44 - 156);
    spColL.style.clipPath = spPolyStr([[0, 0]].concat(scr, [[0, h]]));
    spColR.style.clipPath = spPolyStr(spShifted(scr, -2).concat([[w, h], [w, 0]]));
    var ds = Math.max(w, h) * 2.6;
    var dpts = spBoltPoints(ds / 2 - 108, ds / 2 - 156);
    spDL.style.clipPath = 'none';
    spDR.style.clipPath = spPolyStr(spShifted(dpts, -2).concat([[ds, ds], [ds, 0]]));
    spFR.style.clipPath = spPolyStr(spShifted(dpts, -2).concat([[ds, ds], [ds, 0]]));
  }
  // 寸法は起動時に px で固定する（iOS の URL バー伸縮で innerHeight と
  // vmax がずれる瞬間に、円盤の継ぎ目だけがずれて見えるのを防ぐ）。
  spApplyClips();

  var SPIN_MS = 700;
  var spPhase = 'base'; // base -> entering -> spinning -> exiting -> done
  var spReady = false;
  var spinStartAt = 0;
  function spEnter() {
    if (!spColL.animate) { splash.style.display = 'none'; spPhase = 'done'; return; }
    var dist = window.innerWidth * 1.06;
    var ease = 'cubic-bezier(.22,.9,.3,1)';
    var parts = [
      [spColL, -dist], [spColR, dist], [spDL, -dist], [spDR, dist],
      [spHalfL, -dist], [spHalfR, dist]
    ];
    var last = null;
    parts.forEach(function (pr) {
      var a = pr[0].animate([
        { transform: 'translateX(' + pr[1] + 'px)' },
        { transform: 'translateX(0px)' }
      ], { duration: 500, easing: ease, fill: 'forwards' });
      last = a;
    });
    last.onfinish = function () {
      parts.forEach(function (pr) { pr[0].style.transform = 'translateX(0px)'; });
      spHalfL.style.visibility = 'hidden';
      spHalfR.style.visibility = 'hidden';
      spFull.style.visibility = 'visible';
      spDL.style.display = 'none';
      spDR.style.display = 'none';
      spDiscFull.style.display = 'block';
      spBase.style.display = 'none';
      spRot.classList.add('spinning');
      spinStartAt = performance.now();
      spPhase = 'spinning';
      if (spReady) spArmExitFallback();
    };
  }
  var spExitArmed = false;
  function spArmExitFallback() {
    // 回転の途中では開かず、いまの1回転が元の向きに戻る切れ目で退場する。
    // 正確な切れ目は animationiteration イベントで拾い、これはその保険。
    if (spExitArmed) return;
    spExitArmed = true;
    var rest = SPIN_MS;
    var anims = spRot.getAnimations ? spRot.getAnimations() : [];
    if (anims.length && anims[0].startTime != null) {
      var elapsed = performance.now() - anims[0].startTime;
      rest = SPIN_MS - (elapsed % SPIN_MS);
      if (rest < 60) rest += SPIN_MS;
    }
    setTimeout(spExit, rest + 60);
  }
  spRot.addEventListener('animationiteration', function () {
    if (spReady && spPhase === 'spinning') spExit();
  });
  function spExit() {
    if (spPhase !== 'spinning') return;
    spPhase = 'exiting';
    spRot.classList.remove('spinning');
    spFull.style.visibility = 'hidden';
    spHalfL.style.visibility = 'visible';
    spHalfR.style.visibility = 'visible';
    spDiscFull.style.display = 'none';
    spDL.style.display = 'block';
    spDR.style.display = 'block';
    var dist = window.innerWidth * 1.06;
    var ease = 'cubic-bezier(.55,.06,.68,.4)';
    var parts = [
      [spColL, -dist], [spColR, dist], [spDL, -dist], [spDR, dist],
      [spHalfL, -dist], [spHalfR, dist]
    ];
    var last = null;
    parts.forEach(function (pr) {
      var a = pr[0].animate([
        { transform: 'translateX(0px)' },
        { transform: 'translateX(' + pr[1] + 'px)' }
      ], { duration: 650, easing: ease, fill: 'forwards' });
      last = a;
    });
    last.onfinish = function () {
      splash.style.display = 'none';
      spPhase = 'done';
    };
  }
  function spMarkReady() {
    if (spReady || spPhase === 'done' || spPhase === 'exiting') return;
    spReady = true;
    if (spPhase === 'spinning') spArmExitFallback();
    // base／entering の間は入場が終わってから、最初の1回転の切れ目で退場する。
  }
  // まずアイコンだけを見せ、そのあと両側から覆うように入場する。
  setTimeout(spEnter, 900);
  // 保険: 本体からの合図が来なくても、読み込み画面で塞ぎ続けない。
  var loadFallbackSet = false;
  appFrame.addEventListener('load', function () {
    if (loadFallbackSet) return;
    loadFallbackSet = true;
    setTimeout(spMarkReady, 12000);
  });
  setTimeout(function () {
    if (spPhase !== 'done') { splash.style.display = 'none'; spPhase = 'done'; }
  }, 30000);

  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/script\.googleusercontent\.com$/.test(host)) return;
    var v = e.data && e.data.ticketListTint;
    if (v === 'violet' || v === 'navy') {
      try { localStorage.setItem('ticketListTint', v); } catch (err) {}
    }
    // 前回データの即時表示用: 本体から届いた前回データを保存し、
    // 起動時に本体から求められたら保存分を送り返す。
    if (e.data && e.data.ticketListCacheSave) {
      try { localStorage.setItem('ticketListCache', e.data.ticketListCacheSave); } catch (err) {}
    }
    if (e.data && e.data.ticketListCacheRequest && e.source) {
      var c = '';
      try { c = localStorage.getItem('ticketListCache') || ''; } catch (err) {}
      if (c) { try { e.source.postMessage({ ticketListCacheData: c }, '*'); } catch (err) {} }
    }
    // 本体の初回表示ができたら、読み込み画面の退場を開始する。
    if (e.data && e.data.ticketListReady) spMarkReady();
  });
</script>
</body>
</html>
